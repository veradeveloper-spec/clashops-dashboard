name: Update ClashOps Dashboard Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Save previous war state
        run: |
          if [ -f data/dashboard.json ]; then
            cp data/dashboard.json /tmp/previous-dashboard.json
          else
            echo '{}' > /tmp/previous-dashboard.json
          fi

      - name: Fetch Clash of Clans data
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ vars.CLAN_TAG }}
        run: python scripts/fetch_coc.py

      - name: Send OneSignal notification
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python scripts/send_push.py /tmp/previous-dashboard.json

      - name: Save updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ClashOps dashboard data"
            git push
          else
            echo "No dashboard changes"
          fi
          
